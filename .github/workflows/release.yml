name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PLATFORM_TOOLSET: v143

jobs:
  package:
    name: Package (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $header = Get-Content NulConnect/src/app/Resource.h -Raw
          if ($header -notmatch '#define NC_VERSION_STRING "([^"]+)"') { throw "NC_VERSION_STRING not found" }
          if ("v$($Matches[1])" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match app version $($Matches[1])"
          }

      - name: Fetch prebuilt dependencies
        shell: pwsh
        run: ./tools/update-dependencies.ps1

      - name: Build
        shell: pwsh
        run: msbuild NulConnect.slnx /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=$env:PLATFORM_TOOLSET /v:m /nologo

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Package
        shell: pwsh
        run: ./tools/package.ps1 -SkipBuild

      - name: Write checksums
        shell: pwsh
        run: |
          Set-Location dist
          Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @('release', 'create', $env:GITHUB_REF_NAME, '--title', "NulConnect $env:GITHUB_REF_NAME", '--generate-notes')
          if ($env:GITHUB_REF_NAME -match '-') { $arguments += '--prerelease' }
          gh @arguments (Get-ChildItem dist -File).FullName
